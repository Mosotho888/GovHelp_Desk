<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:replace="~{email/fragments/layout :: emailLayout(
    heading   = 'Password Reset Request',
    reference = 'SYSTEM',
    content   = ~{::section}
)}">
    <section>
        <p>Dear <strong th:text="${actorName}">User</strong>,</p>
        <p>
            We received a request to reset your password.
            Use the OTP code below to complete the process:
        </p>

        <div class="otp-box" style="text-align:center;margin:32px 0;">
            <span class="otp-code"
                  style="font-size:36px;font-weight:bold;letter-spacing:12px;color:#1a56db;background:#f0f4ff;padding:16px 24px;border-radius:8px;display:inline-block;"
                  th:text="${otp}">000000</span>
        </div>

        <p style="text-align:center;color:#666;font-size:14px;">
            This code expires in
            <strong th:text="${otpExpiryMin}">15</strong> minutes.
        </p>
        <p style="text-align:center;color:#999;font-size:13px;">
            If you did not request a password reset, ignore this email.
            Your account remains secure.
        </p>
    </section>
</div>
</body>
</html>
