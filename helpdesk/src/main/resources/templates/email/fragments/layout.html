<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<th:block th:fragment="emailLayout(heading, reference, content)">

    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        .wrapper {
            max-width: 620px;
            margin: 32px auto;
        }

        .container {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .header {
            background: #1a56db;
            color: #fff;
            padding: 20px 28px;
        }

        .header h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .header span {
            font-size: 13px;
            opacity: .85;
        }

        .body {
            padding: 28px;
        }

        .body p {
            margin: 0 0 14px;
            line-height: 1.6;
            font-size: 15px;
        }

        table.details {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        table.details td {
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            font-size: 14px;
        }

        table.details td:first-child {
            background: #f7f7f7;
            font-weight: bold;
            width: 38%;
        }

        .comment-box {
            background: #f0f4ff;
            border-left: 4px solid #1a56db;
            padding: 14px 18px;
            margin: 16px 0;
            border-radius: 0 6px 6px 0;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .badge-open {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-progress {
            background: #fef9c3;
            color: #92400e;
        }

        .badge-resolved {
            background: #dcfce7;
            color: #166534;
        }

        .badge-closed {
            background: #f3f4f6;
            color: #374151;
        }

        .badge-escalated {
            background: #fee2e2;
            color: #991b1b;
        }

        .otp-box {
            text-align: center;
            margin: 32px 0;
        }

        .otp-code {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a56db;
            background: #f0f4ff;
            padding: 16px 24px;
            border-radius: 8px;
            display: inline-block;
        }

        .warning-banner {
            color: #dc2626;
            font-weight: bold;
            margin-top: 16px;
        }

        .breach-banner {
            color: #dc2626;
            font-weight: bold;
        }

        .footer {
            background: #f7f7f7;
            padding: 16px 28px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #e0e0e0;
        }
    </style>

    <div class="wrapper" style="max-width:620px;margin:32px auto;">
        <div class="container" style="background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0;">
            <div class="header" style="background:#1a56db;color:#ffffff;padding:20px 28px;">
                <h2 style="margin:0 0 4px;font-size:20px;" th:text="${heading}">Heading</h2>
                <span style="font-size:13px;opacity:.85;">
                    Reference:
                    <span th:text="${reference}">REF</span>
                </span>
            </div>

            <div class="body" style="padding:28px;">
                <th:block th:replace="${content}"></th:block>
            </div>

            <div class="footer" style="background:#f7f7f7;padding:16px 28px;font-size:12px;color:#999999;border-top:1px solid #e0e0e0;">
                This is an automated message from the Government Helpdesk System.
                Please do not reply directly to this email.
            </div>
        </div>
    </div>

</th:block>

<th:block th:fragment="detailsTable(msg)">
    <table class="details" style="width:100%;border-collapse:collapse;margin-top:16px;">
        <tr>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;background:#f7f7f7;font-weight:bold;width:38%;">Ticket Number</td>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;" th:text="${msg.ticketNumber}">TKT-000</td>
        </tr>

        <tr>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;background:#f7f7f7;font-weight:bold;width:38%;">Subject</td>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;" th:text="${msg.ticketSubject}">Subject</td>
        </tr>

        <tr>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;background:#f7f7f7;font-weight:bold;width:38%;">Status</td>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;">
                <span
                        class="badge"
                        style="padding:2px 10px;border-radius:12px;font-size:13px;font-weight:bold;"
                        th:with="s=${msg.ticketStatus}"
                        th:classappend="${s == 'OPEN' ? 'badge-open' :
                                    s == 'IN_PROGRESS' ? 'badge-progress' :
                                    s == 'RESOLVED' ? 'badge-resolved' :
                                    s == 'ESCALATED' ? 'badge-escalated' :
                                    'badge-closed'}"
                        th:styleappend="${s == 'OPEN' ? 'background:#dbeafe;color:#1d4ed8;' :
                                    s == 'IN_PROGRESS' ? 'background:#fef9c3;color:#92400e;' :
                                    s == 'RESOLVED' ? 'background:#dcfce7;color:#166534;' :
                                    s == 'ESCALATED' ? 'background:#fee2e2;color:#991b1b;' :
                                    'background:#f3f4f6;color:#374151;'}"
                        th:text="${s == 'IN_PROGRESS' ? 'In Progress' :
                             s != null ? #strings.capitalize(#strings.toLowerCase(s)) : '-'}">
                    Open
                </span>
            </td>
        </tr>

        <tr>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;background:#f7f7f7;font-weight:bold;width:38%;">Priority</td>
            <td style="padding:10px 14px;border:1px solid #e0e0e0;font-size:14px;" th:text="${msg.ticketPriority != null ?
                    #strings.capitalize(#strings.toLowerCase(msg.ticketPriority)) : '-'}">
                Medium
            </td>
        </tr>
    </table>
</th:block>

</body>
</html>
