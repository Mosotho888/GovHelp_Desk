<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{email/fragments/layout :: emailLayout(
    heading   = 'Customer Replied',
    reference = ${msg.ticketNumber},
    content   = ~{::section}
)}">
    <section>
        <p>Dear <strong th:text="${msg.agentName}">Agent</strong>,</p>
        <p>
            The customer has added a reply on ticket
            <strong th:text="${msg.ticketNumber}">TKT-000</strong>:
        </p>
        <div class="comment-box"
             style="background:#f0f4ff;border-left:4px solid #1a56db;padding:14px 18px;margin:16px 0;border-radius:0 6px 6px 0;font-size:14px;line-height:1.6;white-space:pre-wrap;"
             th:text="${msg.comment}">Comment body here.
        </div>
        <th:block th:replace="~{email/fragments/layout :: detailsTable(${msg})}"></th:block>
    </section>
</div>
</body>
</html>
