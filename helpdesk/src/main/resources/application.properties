spring.application.name=helpdesk

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${POSTGRES_DB}
spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA Configuration
spring.jpa.database-platform=${HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
#spring.sql.init.mode=always

# Use PostgreSQL JDBC repositories
app.datasource.type=postgresql

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.boot.autoconfigure.mail=DEBUG
logging.level.org.springframework.mail=DEBUG

# RabbitMQ Configuration
#spring.rabbitmq.host=rabbitmq
#spring.rabbitmq.port=${RABBITMQ_PORT}
#spring.rabbitmq.username=${RABBITMQ_USERNAME}
#spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# JWT Configuration
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.access-token-expiry-ms=${JWT_VALIDITY}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_VALIDITY}

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
app.upload.storage-path=${UPLOAD_PATH:./uploads}

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Account Lockout
app.security.max-login-attempts=5

#management.endpoints.web.exposure.include=health
#management.endpoint.health.show-details=always
#management.endpoints.web.base-path=/v1

# RabbitMQ
app.rabbitmq.concurrent-consumers=${MIN_CONCURRENCY}
app.rabbitmq.max-concurrent-consumers=${MIN_CONCURRENCY}
spring.rabbitmq.template.is-channel-transacted=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true

# Rate Limiting
rate-limit.capacity.unauthenticated=100
rate-limit.capacity.user=1000
rate-limit.capacity.agent=5000
rate-limit.capacity.admin=10000