# ── Integration test properties ──────────────────────────────
# DataSource is overridden by Testcontainers @DynamicPropertySource
# These are fallbacks / shared non-DB settings

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=integrationTestSecretKeyMustBeAtLeast32Chars!!
app.jwt.access-token-expiry-ms=3600000
app.jwt.refresh-token-expiry-ms=604800000
app.security.max-login-attempts=5
app.upload.storage-path=/tmp/helpdesk-integration-test

server.servlet.context-path=/api
